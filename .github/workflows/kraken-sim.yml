name: KRAKEN AWS SIMULATION

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: TEST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard
        run: |
          test -f index.html
          echo "TEST OK"

  build:
    name: BUILD - Docker simulated
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Simulating Docker image build"

  sonar:
    name: SONAR - simulated
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Simulating Sonar quality scan"

  qa:
    name: QA - simulated
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - run: echo "Simulating QA acceptance tests"




rod:
    name: QA - simulated
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - run: echo "Simulating QA acceptance tests"

  prod:
    name: PROD - approval gate simulated
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - run: echo "Simulating production approval"

  deploy:
    name: DEPLOY - AWS ECR/ECS simulated
    needs: prod
    runs-on: ubuntu-latest
    steps:
      - run: echo "Simulation complete. No AWS deployment occurred."
