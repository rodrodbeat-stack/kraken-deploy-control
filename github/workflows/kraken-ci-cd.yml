name: KRAKEN CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: 1. Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dashboard files
        run: |
          test -f index.html
          grep -qi "<html" index.html
          grep -qi "</html>" index.html
          echo "Tests passed"


         jobs:
  test:
    name: 1. Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dashboard files
        run: |
          test -f index.html
          grep -qi "<html" index.html
          grep -qi "</html>" index.html
          echo "Tests passed" 

  build:
    name: 2. Build artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: 3. Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
