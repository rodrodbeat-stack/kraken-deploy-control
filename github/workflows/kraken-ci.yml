name: KRAKEN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f README.md
          echo "KRAKEN dashboard files found."

      - name: Validate HTML structure
        run: |
          grep -qi "<html" index.html
          grep -qi "</html>" index.html
          grep -qi "<body" index.html
          echo "HTML structure looks present."
